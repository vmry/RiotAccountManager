[package]
name = "riot-account-manager"
version = "1.0.0"
description = "A clean desktop manager for multiple League of Legends accounts"
authors = ["vmry"]
edition = "2021"

[lib]
name = "riot_account_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "4", features = ["v1"] }
directories = "6"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.10"
base64 = "0.22"
rfd = "0.15"
arboard = "3"
open = "5"
urlencoding = "2"
